server:
  port: 8080

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini

whatsapp:
  # Get these from Meta for Developers: https://developers.facebook.com/apps
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:your-phone-number-id}
  access-token: ${WHATSAPP_ACCESS_TOKEN:your-access-token}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:your-verify-token}

spring:
  application:
    name: chatbot
  datasource:
    url: jdbc:h2:file:./data/chatbot
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

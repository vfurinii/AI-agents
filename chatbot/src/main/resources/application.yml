server:
  port: 8080
openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o-mini
spring:
  application:
    name: chatbot
  datasource:
    url: jdbc:h2:file:./data/chatbot
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

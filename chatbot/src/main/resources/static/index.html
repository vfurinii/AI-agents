<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #343541;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #202123;
            padding: 16px 20px;
            color: white;
            text-align: center;
            border-bottom: 1px solid #444654;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 16px;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .message.user {
            background-color: #343541;
        }

        .message.assistant {
            background-color: #444654;
        }

        .message-icon {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .message.user .message-icon {
            background-color: #5436DA;
            color: white;
        }

        .message.assistant .message-icon {
            background-color: #19C37D;
            color: white;
        }

        .message-content {
            color: #ECECF1;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .input-container {
            background-color: #343541;
            padding: 20px;
            border-top: 1px solid #444654;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            display: flex;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            background-color: #40414F;
            border: 1px solid #565869;
            border-radius: 8px;
            color: white;
            padding: 12px 16px;
            font-size: 16px;
            resize: none;
            min-height: 52px;
            max-height: 200px;
            font-family: inherit;
            outline: none;
        }

        .message-input:focus {
            border-color: #19C37D;
        }

        .send-button {
            background-color: #19C37D;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
            height: 52px;
            white-space: nowrap;
        }

        .send-button:hover:not(:disabled) {
            background-color: #1A9A6C;
        }

        .send-button:disabled {
            background-color: #444654;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .clear-button {
            background-color: #565869;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s;
            height: 52px;
        }

        .clear-button:hover {
            background-color: #676879;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 8px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #19C37D;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .loading-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        .empty-state {
            color: #8E8EA0;
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            margin: auto;
        }

        .empty-state h2 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 16px;
            line-height: 1.6;
        }

        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: #343541;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #565869;
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #676879;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI Chatbot</h1>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="empty-state">
            <h2>Welcome to AI Chatbot</h2>
            <p>Start a conversation by typing a message below. Ask questions, get weather information, or just chat!</p>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Type your message here..."
                rows="1"
            ></textarea>
            <button id="sendButton" class="send-button">Send</button>
            <button id="clearButton" class="clear-button">Clear</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const clearButton = document.getElementById('clearButton');

        // Auto-resize textarea
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        // Send message on Enter (Shift+Enter for new line)
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendButton.addEventListener('click', sendMessage);
        clearButton.addEventListener('click', clearChat);

        function addMessage(content, isUser) {
            // Remove empty state if it exists
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

            messageDiv.innerHTML = `
                <div class="message-icon">${isUser ? 'U' : 'AI'}</div>
                <div class="message-content">${content}</div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addLoadingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'loadingMessage';

            messageDiv.innerHTML = `
                <div class="message-icon">AI</div>
                <div class="message-content">
                    <div class="loading">
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                        <div class="loading-dot"></div>
                    </div>
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoadingMessage() {
            const loadingMessage = document.getElementById('loadingMessage');
            if (loadingMessage) {
                loadingMessage.remove();
            }
        }

        async function sendMessage() {
            const message = messageInput.value.trim();

            if (!message) {
                return;
            }

            // Disable input while processing
            messageInput.disabled = true;
            sendButton.disabled = true;

            // Add user message to chat
            addMessage(message, true);

            // Clear input
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Add loading indicator
            addLoadingMessage();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: message
                });

                removeLoadingMessage();

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const assistantMessage = await response.text();
                addMessage(assistantMessage, false);

            } catch (error) {
                removeLoadingMessage();
                console.error('Error:', error);
                addMessage('Sorry, I encountered an error. Please try again.', false);
            } finally {
                // Re-enable input
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        function clearChat() {
            chatContainer.innerHTML = `
                <div class="empty-state">
                    <h2>Welcome to AI Chatbot</h2>
                    <p>Start a conversation by typing a message below. Ask questions, get weather information, or just chat!</p>
                </div>
            `;
        }

        // Focus input on load
        messageInput.focus();
    </script>
</body>
</html>
